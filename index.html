<!DOCTYPE html>
<!-- 
Subjects need to judge whether two green lines are the same or different in length. Theoratically, accuracy should be higher when the two lines appear on the same object than when they appear on different objects.
We use a within-subject, blocked imagery paradigm design with three conditions: middle, top, and behind. 
Block order is randomized per participant. Occluder and square colors are randomized across participants.
-->
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Same or Different?</title>
		<link
			href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css"
			rel="stylesheet"
			type="text/css" />
		<link
			rel="stylesheet"
			type="text/css"
			href="style.css" />
	</head>
	<body>
		<div id="progressContainer">
			<div
				class="progress"
				id="progressText">
				Study Progress
			</div>
			<div
				class="progress"
				id="progressOutline">
				<div
					class="progress"
					id="progressBar"></div>
			</div>
		</div>
		<div id="contentContainer">
			<div id="jspsych-target"></div>
		</div>
	</body>
	<script src="jquery-3.4.1.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
	<script src="https://unpkg.com/jspsych@7.0.0"></script>
	<script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
	<script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
	<script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.4"></script>
	<script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
	<script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@1.1.3"></script>
	<script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.0.0"></script>
	<script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.1"></script>
	<script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
	<script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
	<script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>

	<script src="experiment.js"></script>
</html>
