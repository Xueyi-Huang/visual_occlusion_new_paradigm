<!DOCTYPE html>
<!--
This experiment examines the same-object advantage in visual perception. 
Each trial presents a fixation cross, a grid containing two squares, and then either an occluding bar or nothing. Two green lines subsequently appear inside the squares. Participants judge whether the lines have the same or different lengths using Z and M.
The four blocks cross line orientation (vertical or horizontal) with occluder presence (present or absent). Block order and trial order within each block are randomized. 
Response-key mapping and square/occluder colors are randomly assigned per participant. Randomization is seeded by participant ID for reproducibility.
-->
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Same or Different?</title>
		<link
			href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css"
			rel="stylesheet"
			type="text/css" />
		<link
			rel="stylesheet"
			type="text/css"
			href="style.css" />
	</head>
	<body>
		<div id="progressContainer">
			<div
				class="progress"
				id="progressText">
				Study Progress
			</div>
			<div
				class="progress"
				id="progressOutline">
				<div
					class="progress"
					id="progressBar"></div>
			</div>
		</div>
		<div id="contentContainer">
			<div id="jspsych-target"></div>
		</div>
	</body>
	<script src="jquery-3.4.1.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
